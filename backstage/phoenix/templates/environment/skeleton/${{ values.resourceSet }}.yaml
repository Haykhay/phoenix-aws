{%- set a = values.annotations -%}
{%- set accountId = a['phoenix/account-id'] -%}
# Written by Backstage (template phoenix-environment). Identity, account and
# state come from the account registry; spec comes from the request form.
organisation: ${{ a['phoenix/organisation'] }}
group: ${{ values.group }}
environment: ${{ values.environment }}
{%- if values.requester %}
requester: ${{ values.requester }}
{%- endif %}
tier: sandbox
{%- if values.resourceSet != 'dns' %}
region: ${{ values.region }}
{%- endif %}
account_id: "${{ accountId }}"
module_ref: main
state:
  bucket: ${{ a['phoenix/state-bucket'] }}
  region: ${{ a['phoenix/state-region'] }}
tags:
  owner.team: ${{ values.group }}
{%- if values.squad %}
  owner.squad: ${{ values.squad | dump }}
{%- endif %}
  Reason: ${{ values.reason | dump }}
  Lifecycle: ${{ values.kind }}
  LongLive: ${{ 'true' if values.kind == 'always-on' else 'false' }}
spec:
{%- if values.resourceSet == 'core-network' %}
  vpcs:
    vpc-1:
      pool: nonprod
      azs: [${{ values.region }}a, ${{ values.region }}b, ${{ values.region }}c]
      enable_nat_gateway: true
      enable_vpc_endpoints: true
{%- elif values.resourceSet == 'core-platform' %}
  cluster_defaults:
    version: "1.34"
    cluster_addons:
      aws-ebs-csi-driver: {}
      coredns: {}
      eks-pod-identity-agent: {}
      kube-proxy: {}
      vpc-cni: {}
    pod_identity:
      aws_ebs_csi:
        enabled: true
    node_role_additional_policies:
      ecr_pull_through: arn:aws:iam::${{ accountId }}:policy/${{ values.group }}-shared-${{ values.regionCode }}-ecr-pull-through
  clusters:
    "1":
      karpenter:
        enabled: true
      node_groups:
        system-1:
          instance_types: [m6i.xlarge]
          min_size: 2
          max_size: 4
          desired_size: 2
  observability:
    enabled: true
{%- elif values.resourceSet == 'data-rds' %}
  instances:
    langfuse:
      engine: postgres
      engine_version: "16.14"
      family: postgres16
      major_engine_version: "16"
      instance_class: db.t4g.small
      allocated_storage: 20
      backup_retention_period: 1
      apply_immediately: true
      eks_clusters: ["1"]
{%- elif values.resourceSet == 'dns' %}
  providers:
    management:
      account_id: "${{ a['phoenix/management-account-id'] }}"
  zones:
    zone-1:
      public_zone_name: ${{ (values.requester ~ '.') if values.requester }}${{ values.environment }}.${{ values.group }}.${{ a['phoenix/base-domain'] }}
      internal_zone_name: internal.${{ (values.requester ~ '.') if values.requester }}${{ values.environment }}.${{ values.group }}.${{ a['phoenix/base-domain'] }}
{%- endif %}
