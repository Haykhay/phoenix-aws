# Written by Backstage (template phoenix-environment): the cluster the Phoenix
# workload form offers. One per core-platform cluster.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: cluster-${{ values.envId }}-${{ values.region }}-1
  title: ${{ values.envId }} / ${{ values.region }} / cluster 1
  annotations:
    phoenix/env-id: ${{ values.envId }}
    phoenix/group: ${{ values.group }}
    phoenix/environment: ${{ values.environment }}
{%- if values.requester %}
    phoenix/requester: ${{ values.requester }}
{%- endif %}
    phoenix/tier: sandbox
    phoenix/region: ${{ values.region }}
    phoenix/cluster: "1"
spec:
  type: phoenix-cluster
  owner: group:default/${{ values.group }}
  dependsOn:
    - resource:default/${{ values.group }}-aws-account
