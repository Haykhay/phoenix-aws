# Database types. Stage and above map to infrastructure's managed data-* units instead.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: database-postgres
  title: PostgreSQL
  description: "PostgreSQL (CloudNativePG in sandbox)."
spec:
  type: phoenix-database
  owner: group:default/platform
  dependsOn:
    - resource:default/component-external-secrets
    - resource:default/component-cloudnative-pg
    - resource:default/component-cloudnative-pg-cluster
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: database-redis
  title: Redis
  description: "Redis-compatible (Valkey in sandbox)."
spec:
  type: phoenix-database
  owner: group:default/platform
  dependsOn:
    - resource:default/component-external-secrets
    - resource:default/component-valkey-redis
    - resource:default/component-valkey-redis-cluster
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: database-kafka
  title: Kafka
  description: "Kafka (Strimzi in sandbox)."
spec:
  type: phoenix-database
  owner: group:default/platform
  dependsOn:
    - resource:default/component-external-secrets
    - resource:default/component-strimzi-kafka
    - resource:default/component-strimzi-kafka-cluster
