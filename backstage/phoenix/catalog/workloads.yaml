# Workload types offered in the Phoenix workload form (plus the hidden baseline).
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: workload-baseline
  title: Baseline
  description: "Installed on every cluster; never shown in the form."
spec:
  type: phoenix-baseline
  owner: group:default/platform
  dependsOn:
    - resource:default/component-cluster-config
    - resource:default/component-karpenter
    - resource:default/component-kyverno
    - resource:default/component-falco
    - resource:default/component-reloader
    - resource:default/component-external-secrets
    - resource:default/component-grafana-stack
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: workload-service
  title: Service
  description: "A normal service or API: load balancing, DNS, certificates, gateway, delivery."
spec:
  type: phoenix-workload
  owner: group:default/platform
  dependsOn:
    - resource:default/component-cert-manager
    - resource:default/component-aws-load-balancer-controller
    - resource:default/component-istio
    - resource:default/component-external-dns
    - resource:default/component-argo-cd
    - resource:default/component-kargo
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: workload-model-serving
  title: Model serving
  description: "Serve a model with vLLM behind the inference gateway, traced in Langfuse."
spec:
  type: phoenix-workload
  owner: group:default/platform
  dependsOn:
    - resource:default/component-cert-manager
    - resource:default/component-aws-load-balancer-controller
    - resource:default/component-istio
    - resource:default/component-external-dns
    - resource:default/component-argo-cd
    - resource:default/component-kargo
    - resource:default/component-nvidia-gpu-operator
    - resource:default/component-vllm
    - resource:default/component-clickhouse-operator
    - resource:default/component-langfuse
