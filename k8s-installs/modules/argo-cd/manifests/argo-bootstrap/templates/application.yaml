apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: {{ .Values.repoUrl | quote }}
      targetRevision: HEAD
      path: {{ .Values.bootstrapPath }}
      helm:
        releaseName: argo-bootstrap
        valueFiles:
          - $values/{{ .Values.valuesFile }}
    - repoURL: {{ .Values.repoUrl | quote }}
      targetRevision: HEAD
      ref: values
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
