{{- range .Values.accountIds }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: ECRAuthorizationToken
metadata:
  name: ecr-registry-{{ . }}
  namespace: {{ $.Release.Namespace }}
spec:
  # The token is valid for every registry the external-secrets role can reach
  # in this region; the URL below picks the account.
  region: {{ $.Values.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-ecr-registry-{{ . }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: 6h
  target:
    name: argocd-ecr-registry-{{ . }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: helm
        enableOCI: "true"
        name: ecr-registry-{{ . }}
        url: {{ . }}.dkr.ecr.{{ $.Values.region }}.amazonaws.com
        username: "{{ "{{" }} .username {{ "}}" }}"
        password: "{{ "{{" }} .password {{ "}}" }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ECRAuthorizationToken
          name: ecr-registry-{{ . }}
{{- end }}
