{{- if .Values.credentialsSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-source
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.name }}-source
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.credentialsSecret }}
        property: token
{{- end }}
