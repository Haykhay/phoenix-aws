{{- with .Values.access }}
{{- with .rateLimit }}
# Requests per minute per consumer, on this model's hostname only: right after
# this model's Lua filter, keyed on the header it stamps from the caller's
# CIDR (and strips from every other host). Over the limit: 429. Requests with
# no listed consumer (the owner, other models) only meet the default bucket,
# sized never to bind. Per gateway replica. Only fields of the Envoy that
# istio 1.30.1 ships (1.38): an unknown field makes the gateway reject its
# whole config update.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: {{ $.Values.name }}-ratelimit
  namespace: {{ $.Values.access.gateway.namespace }}
spec:
  workloadSelector:
    labels: {{ toJson (dict "gateway.networking.k8s.io/gateway-name" $.Values.access.gateway.name) }}
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.lua.{{ $.Values.name }}
      patch:
        operation: INSERT_AFTER
        value:
          name: envoy.filters.http.local_ratelimit.{{ $.Values.name }}
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
            stat_prefix: {{ printf "phoenix_%s" ($.Values.name | replace "-" "_") }}
            token_bucket: { max_tokens: 1000000000, tokens_per_fill: 1000000000, fill_interval: 1s }
            filter_enabled:
              runtime_key: {{ printf "phoenix_%s_enabled" ($.Values.name | replace "-" "_") }}
              default_value: { numerator: 100, denominator: HUNDRED }
            filter_enforced:
              runtime_key: {{ printf "phoenix_%s_enforced" ($.Values.name | replace "-" "_") }}
              default_value: { numerator: 100, denominator: HUNDRED }
            always_consume_default_token_bucket: false
            rate_limits:
              - actions:
                  - request_headers: { header_name: {{ .header | quote }}, descriptor_key: consumer }
            descriptors:
{{- range .consumers }}
              - entries: [{ key: consumer, value: {{ .name | quote }} }]
                token_bucket: { max_tokens: {{ .requestsPerMinute }}, tokens_per_fill: {{ .requestsPerMinute }}, fill_interval: 60s }
{{- end }}
{{- end }}
{{- end }}
