{{- if not .Values.llmD }}
# Default path. With any llm-d option, llm-d.yaml renders the server instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
      annotations:
        # grafana-stack's Alloy scrapes vLLM's /metrics.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      nodeSelector:
        phoenix/gpu: {{ .Values.gpu.type | quote }}
      tolerations:
        - key: {{ .Values.accelerator.taint }}
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- with .Values.command }}
          command: {{ toJson . }}
          {{- end }}
          args:
            - --model={{ .Values.modelPath }}
            - --served-model-name={{ .Values.servedName }}
            - --port=8000
            - --tensor-parallel-size={{ .Values.tensorParallel }}
            {{- with .Values.maxModelLen }}
            - --max-model-len={{ . }}
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            # Weights come from the cache only; never the internet.
            - name: HF_HUB_OFFLINE
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              {{ .Values.accelerator.resource }}: {{ .Values.gpu.perReplica }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: {{ div .Values.startupSeconds 10 }} # max(30 min, 6 s per GiB of weights)
          volumeMounts:
            - name: weights
              mountPath: {{ .Values.cache.mountPath }}
              subPath: {{ .Values.cache.subPath }}
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: weights
          persistentVolumeClaim:
            claimName: {{ .Values.cache.claim }}
            readOnly: true
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Values.name }}
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
