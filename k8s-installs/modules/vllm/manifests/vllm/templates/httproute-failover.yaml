{{- with .Values.route.failover }}
# The hostname this model's clusters share: a Route 53 failover record per
# cluster (this one {{ .role }}), an alias to this cluster's gateway NLB that
# Route 53 leaves when the NLB has no healthy targets. Its own route, so the
# failover annotations never touch the cluster's own hostname's record.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.Values.name }}-failover
  namespace: {{ $.Release.Namespace }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .hostname | quote }}
    external-dns.alpha.kubernetes.io/set-identifier: {{ .setIdentifier | quote }}
    external-dns.alpha.kubernetes.io/aws-failover: {{ .role | quote }}
    external-dns.alpha.kubernetes.io/aws-evaluate-target-health: "true"
spec:
  parentRefs:
    - name: {{ $.Values.route.gateway.name }}
      namespace: {{ $.Values.route.gateway.namespace }}
  hostnames:
    - {{ .hostname | quote }}
  rules:
    - backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: {{ $.Values.route.pool }}
{{- end }}
