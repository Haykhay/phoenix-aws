{{- if .Values.gateways.internal.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-internal
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- range $key, $value := .Values.gateways.internal.serviceAnnotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  gatewayClassName: istio
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.{{ .Values.certs.internalZoneName }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.certs.internalSecretName }}
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*.{{ .Values.certs.internalZoneName }}"
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
