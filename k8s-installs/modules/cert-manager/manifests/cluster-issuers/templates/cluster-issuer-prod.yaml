apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    {{- if .Values.acmeEmail }}
    email: {{ .Values.acmeEmail }}
    {{- end }}
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          route53:
            region: {{ .Values.awsRegion }}
            hostedZoneID: {{ .Values.publicZoneId }}
        selector:
          dnsZones:
            - {{ .Values.publicZoneName | quote }}
      - dns01:
          route53:
            region: {{ .Values.awsRegion }}
            hostedZoneID: {{ .Values.internalZoneId }}
        selector:
          dnsZones:
            - {{ .Values.internalZoneName | quote }}
