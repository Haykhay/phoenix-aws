apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ .Values.name }}
spec:
  template:
    metadata:
      labels:
        phoenix/gpu: {{ .Values.gpuType | quote }}
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: {{ .Values.name }}
      expireAfter: {{ .Values.expireAfter }}
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ toJson .Values.capacityTypes }}
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: {{ toJson .Values.instanceFamilies }}
        - key: karpenter.k8s.aws/instance-gpu-count
          operator: Lt
          values: [{{ add1 .Values.gpuCountMax | quote }}]
  limits:
    nvidia.com/gpu: {{ .Values.gpuLimit }}
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: {{ .Values.consolidateAfter }}
