{{- range .Values.users }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ .name }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .smSecretName }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .smSecretName }}
        property: password
{{- end }}
