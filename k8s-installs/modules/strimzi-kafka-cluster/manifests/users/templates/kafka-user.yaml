{{- range .Values.users }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    strimzi.io/cluster: {{ $.Values.clusterName }}
spec:
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: {{ .name }}
          key: password
  {{- if .acls }}
  authorization:
    type: simple
    acls:
{{- range .acls }}
      - resource:
          type: {{ .resource_type }}
          name: {{ .name }}
          patternType: {{ default "literal" .pattern_type }}
        operations:
{{- range .operations }}
          - {{ . }}
{{- end }}
{{- end }}
  {{- else }}
  authorization:
    type: simple
    acls: []
  {{- end }}
{{- end }}
