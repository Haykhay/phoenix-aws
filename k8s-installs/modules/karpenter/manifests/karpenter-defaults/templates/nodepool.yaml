apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ .Values.nodePool.name }}
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: {{ .Values.nodeClass.name }}
      expireAfter: {{ .Values.nodePool.expireAfter }}
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ toJson .Values.nodePool.capacityTypes }}
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: {{ toJson .Values.nodePool.instanceCategory }}
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: [{{ .Values.nodePool.instanceGenMin | quote }}]
  limits:
    cpu: {{ .Values.nodePool.cpuLimit }}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: {{ .Values.nodePool.consolidateAfter }}
