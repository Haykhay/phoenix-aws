apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clusterName }}-superuser
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.clusterName }}-superuser
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.superuserSmSecretName }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.superuserSmSecretName }}
        property: password
{{- range .Values.databases }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.clusterName }}-{{ .name | replace "_" "-" }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ $.Values.clusterName }}-{{ .name | replace "_" "-" }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .smSecretName }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .smSecretName }}
        property: password
{{- end }}
