name: terraform

run-name: >-
  terraform ${{ inputs.action || 'plan' }}
  ${{ inputs.config_file || github.ref_name }}
  ${{ inputs.orchestration_id && format('[{0}]', inputs.orchestration_id) || '' }}

# One run = one unit = one YAML file, path relative to the repo root:
#   infrastructure/environments/<tier>/<env_id>/<scope>/<resource-set>.yaml
#   networking/environments/<scope>/<unit>[.<instance>].yaml
#
# Backstage calls workflow_dispatch with config_file + action, in dependency
# order (Layer 1: networking units when a region is new; Layer 2: core-network
# -> core-platform -> data-*; Layer 3 is phoenix-k8s's own workflow, after the
# cluster's core-platform), destroying in reverse, and
# stops the chain on a failed run. Pull requests plan every changed YAML and
# test every changed module.
#
# Removing a unit is a destroy dispatched by Backstage *before* its YAML is
# deleted; a deleted YAML on its own plans nothing.

on:
  pull_request:
    paths:
      - "infrastructure/environments/**.yaml"
      - "infrastructure/modules/**"
      - "networking/environments/**.yaml"
      - "networking/modules/**"
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: "Unique Backstage orchestration attempt ID used to correlate this run"
        required: true
        type: string
      config_file:
        description: "Unit YAML from the repo root, e.g. infrastructure/environments/sandbox/research-sandbox-jdoe/eu-west-1/core-platform.yaml"
        required: true
        type: string
      action:
        description: "plan, apply or destroy (apply/destroy only from main)"
        required: true
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "~1.15.0"

jobs:
  # Which units and modules this run covers, and where each unit runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.diff.outputs.units }}
      modules: ${{ steps.diff.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$ORCHESTRATION_ID" =~ ^[A-Za-z0-9._:-]+$ ]] || {
              echo "::error::orchestration_id has unsupported characters"; exit 1;
            }
            files="$CONFIG_FILE"; modules=""
          else
            base="origin/$BASE_REF"
            files=$(git diff --name-only --diff-filter=AMR "$base...HEAD" -- \
              'infrastructure/environments/**.yaml' 'networking/environments/**.yaml')
            # <project>/modules/<name>
            modules=$(git diff --name-only "$base...HEAD" -- 'infrastructure/modules/' 'networking/modules/' \
              | cut -d/ -f1-3 | sort -u || true)
            # Only directories are modules: files beside them (modules/README.md) are docs.
            modules=$(while read -r d; do if [ -d "$d" ]; then printf '%s\n' "$d"; fi; done <<<"$modules")
            # networking builds on infrastructure (it sources modules/context):
            # any infrastructure module change re-tests every networking module.
            # phoenix-k8s pins context and credentials to a release tag and
            # re-tests when it moves to a new one.
            if grep -q '^infrastructure/modules/' <<<"$modules"; then
              dependents=$(find networking/modules -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort || true)
              modules=$(printf '%s\n%s\n' "$modules" "$dependents" | sort -u)
            fi
          fi
          units=$(printf '%s\n' "$files" | jq -Rnc '[inputs | select(length > 0)]')
          modules=$(printf '%s\n' "$modules" | jq -Rnc '[inputs | select(length > 0)]')
          echo "units=$units" >> "$GITHUB_OUTPUT"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "units: $units"; echo "modules: $modules"

  # Module changes: terraform test against mock providers, no AWS access.
  module-tests:
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform test
        working-directory: ${{ matrix.module }}
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          if ls tests/*.tftest.hcl >/dev/null 2>&1; then terraform test; else terraform validate; fi

  unit:
    needs: changes
    if: needs.changes.outputs.units != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config_file: ${{ fromJSON(needs.changes.outputs.units) }}
    concurrency:
      group: tf-${{ matrix.config_file }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Read unit
        id: unit
        env:
          FILE: ${{ matrix.config_file }}
          ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'plan' }}
        run: |
          set -euo pipefail
          err() { echo "::error::$*"; exit 1; }
          ident='^[a-z0-9]+(-[a-z0-9]+)*$'
          # Paths reach shell commands and the job summary: a closed character set first.
          [[ "$FILE" =~ ^[a-z0-9._/-]+$ ]] || err "unit path has unsupported characters (allowed: a-z 0-9 . _ / -)"
          [ -f "$FILE" ] || err "$FILE does not exist"
          IFS=/ read -r project root tier env_id scope rest <<<"$FILE"
          [ "$root" = environments ] || err "$FILE is not <project>/environments/..."
          case "$project" in
            infrastructure)
              # infrastructure/environments/<tier>/<env_id>/<scope>/<resource-set>.yaml
              [[ "$rest" == *.yaml && "$rest" != */* ]] || err "$FILE is not infrastructure/environments/<tier>/<env_id>/<scope>/<resource-set>.yaml"
              rs="${rest%.yaml}"
              [ "$rs" != context ] && [ "$rs" != credentials ] && [ -d "$project/modules/$rs" ] || err "no resource set $project/modules/$rs"
              state_key="$env_id/$scope/$rs/terraform.tfstate"
              ;;
            networking)
              # networking/environments/<scope>/<unit>[.<instance>].yaml, one
              # environment (platform-network, tier prod) for the whole platform.
              IFS=/ read -r _ _ scope file extra <<<"$FILE"
              [[ -z "$extra" && "$file" == *.yaml ]] || err "$FILE is not networking/environments/<scope>/<unit>[.<instance>].yaml"
              unit="${file%.yaml}"; rs="${unit%%.*}"
              if [ "$unit" != "$rs" ]; then
                [[ "${unit#*.}" =~ $ident ]] || err "instance '${unit#*.}' must match $ident"
              fi
              [ -d "$project/modules/$rs" ] || err "no unit $project/modules/$rs"
              tier=prod; env_id=platform-network
              state_key="$env_id/$scope/$unit/terraform.tfstate"
              ;;
            *) err "unknown project '$project' in $FILE" ;;
          esac

          y() { yq -r "$1" "$FILE"; }
          yaml_env_id=$(y '[.group, .environment, .requester] | map(select(. != null)) | join("-")')
          yaml_scope=$(y '.region // "global"')
          [ "$(y .tier)" = "$tier" ] || err "tier in the YAML ($(y .tier)) does not match the path ($tier)"
          [ "$yaml_env_id" = "$env_id" ] || err "env_id from the YAML ($yaml_env_id) does not match the path ($env_id)"
          [ "$yaml_scope" = "$scope" ] || err "region in the YAML ($yaml_scope) does not match the path ($scope)"

          # Pull requests plan as Terraform-Plan-Role (it trusts
          # repo:<repo>:pull_request); everything dispatched runs from main as
          # Terraform-Role (it trusts refs/heads/main). Both are the account
          # baseline's (phoenix-aws-org; ADR-0013).
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            err "$ACTION only runs from main (or as a pull-request plan)"
          fi

          account_id=$(y .account_id)
          [[ "$account_id" =~ ^[0-9]{12}$ ]] || err "account_id must be 12 digits"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then role=Terraform-Plan-Role; else role=Terraform-Role; fi
          {
            echo "action=$ACTION"
            echo "project=$project"
            echo "resource_set=$rs"
            echo "module_ref=$(y '.module_ref // "main"')"
            echo "role_arn=arn:aws:iam::$account_id:role/$role"
            echo "aws_region=$(y '.region // .global_region // "us-east-1"')"
            echo "state_bucket=$(y .state.bucket)"
            echo "state_region=$(y .state.region)"
            echo "state_kms_key_id=$(y '.state.kms_key_id // ""')"
            echo "state_key=$state_key"
          } >> "$GITHUB_OUTPUT"

      # Modules run from the ref the YAML pins: main for sandboxes, a release
      # tag for stage/UAT/prod. The YAML itself always comes from this checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.unit.outputs.module_ref }}
          path: src

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.unit.outputs.role_arn }}
          role-session-name: gha-${{ github.run_id }}-${{ steps.unit.outputs.resource_set }}
          aws-region: ${{ steps.unit.outputs.aws_region }}

      - name: terraform init
        working-directory: src/${{ steps.unit.outputs.project }}/modules/${{ steps.unit.outputs.resource_set }}
        # The state lives in the unit's account: the backend uses the job's
        # credentials, as the providers and state reads do.
        env:
          STATE_BUCKET: ${{ steps.unit.outputs.state_bucket }}
          STATE_KEY: ${{ steps.unit.outputs.state_key }}
          STATE_REGION: ${{ steps.unit.outputs.state_region }}
          STATE_KMS_KEY_ID: ${{ steps.unit.outputs.state_kms_key_id }}
        run: |
          backend="$RUNNER_TEMP/backend.hcl"
          {
            printf 'bucket       = "%s"\n' "$STATE_BUCKET"
            printf 'key          = "%s"\n' "$STATE_KEY"
            printf 'region       = "%s"\n' "$STATE_REGION"
            printf 'encrypt      = true\n'
            printf 'use_lockfile = true\n'
            if [ -n "$STATE_KMS_KEY_ID" ]; then printf 'kms_key_id   = "%s"\n' "$STATE_KMS_KEY_ID"; fi
          } > "$backend"
          terraform init -backend-config="$backend"

      - name: terraform ${{ steps.unit.outputs.action }}
        working-directory: src/${{ steps.unit.outputs.project }}/modules/${{ steps.unit.outputs.resource_set }}
        env:
          TF_VAR_config_file: ${{ github.workspace }}/${{ matrix.config_file }}
          TF_VAR_pipeline_user: ${{ github.actor }}
          UNIT_FILE: ${{ matrix.config_file }}
        run: |
          set -o pipefail
          case "${{ steps.unit.outputs.action }}" in
            plan)    terraform plan -out=tfplan ;;
            apply)   terraform apply -auto-approve ;;
            destroy) terraform destroy -auto-approve ;;
          esac
          if [ -f tfplan ]; then
            {
              echo "### $UNIT_FILE"
              echo '```'
              terraform show -no-color tfplan | tail -n 300
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
